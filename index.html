                                                    </div>
                                                    <div className="min-w-0">
                                                        <div className="text-sm font-bold text-white truncate">
                                                            {selectedRecipient.fullName}
                                                        </div>
                                                        <div className="text-[11px] text-emerald-300 font-mono">
                                                            {selectedRecipient.walletNumber || generateWalletNumber(selectedRecipient.uid)}
                                                        </div>
                                                    </div>
                                                </div>

                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        setSelectedRecipient(null);
                                                        setRecipientQuery('');
                                                        setDropdownOpen(true);
                                                    }}
                                                    className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold text-white shrink-0 cursor-pointer"
                                                >
                                                    {t.changeRecipient}
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="relative">
                                                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-white/45">
                                                    <Icon name="search" size={18} />
                                                </span>
                                                <input
                                                    type="text"
                                                    value={recipientQuery}
                                                    onFocus={() => setDropdownOpen(true)}
                                                    onChange={(e) => {
                                                        setRecipientQuery(e.target.value);
                                                        setDropdownOpen(true);
                                                        setSendError('');
                                                    }}
                                                    placeholder={t.recipientPlaceholder}
                                                    className="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-navy-950/70 border border-white/15 focus:border-emerald-400 focus:outline-none text-sm text-white placeholder-white/35"
                                                />

                                                {/* Autocomplete Dropdown starting from first typed character */}
                                                {dropdownOpen && recipientQuery.trim().length > 0 && (
                                                    <div className="absolute left-0 right-0 mt-2 rounded-2xl bg-navy-900 border border-white/15 shadow-2xl z-20 max-h-60 overflow-y-auto divide-y divide-white/5">
                                                        {matchingRecipients.length === 0 ? (
                                                            <div className="p-4 text-center text-xs text-white/60 flex items-center justify-center gap-2">
                                                                <Icon name="user-x" size={15} className="text-white/45" />
                                                                <span>{t.userNotFound}</span>
                                                            </div>
                                                        ) : (
                                                            matchingRecipients.map((user) => (
                                                                <button
                                                                    key={user.uid || user.id}
                                                                    type="button"
                                                                    onClick={() => {
                                                                        setSelectedRecipient(user);
                                                                        setRecipientQuery(user.fullName);
                                                                        setDropdownOpen(false);
                                                                        setSendError('');
                                                                    }}
                                                                    className="w-full p-3.5 hover:bg-emerald-500/15 flex items-center gap-3 text-left transition-colors cursor-pointer"
                                                                >
                                                                    <div className="w-9 h-9 rounded-full bg-emerald-500/20 border border-emerald-400/35 text-emerald-300 font-bold text-sm flex items-center justify-center shrink-0">
                                                                        {(user.fullName || 'U').charAt(0).toUpperCase()}
                                                                    </div>
                                                                    <div className="min-w-0 flex-1">
                                                                        <div className="text-sm font-semibold text-white truncate">
                                                                            {user.fullName}
                                                                        </div>
                                                                        <div className="text-[11px] text-white/50 font-mono">
                                                                            {user.walletNumber || generateWalletNumber(user.uid)}
                                                                        </div>
                                                                    </div>
                                                                    <Icon name="chevron-right" size={16} className="text-white/40" />
                                                                </button>
                                                            ))
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>

                                    {/* SECOND INPUT: Amount of ORINJI Coins */}
                                    <div>
                                        <div className="flex items-center justify-between mb-2">
                                            <label className="text-xs font-semibold text-white/75">{t.amountLabel}</label>
                                            <span className="text-xs text-white/60">
                                                {t.availableBalance}: <strong className="text-emerald-400">{formatCoins(currentBalance)} ORINJI</strong>
                                            </span>
                                        </div>

                                        <div className="relative">
                                            <input
                                                type="number"
                                                step="any"
                                                min="0.01"
                                                value={sendAmount}
                                                onChange={(e) => {
                                                    setSendAmount(e.target.value);
                                                    setSendError('');
                                                }}
                                                placeholder={t.enterAmountPlaceholder}
                                                className="w-full pl-4 pr-20 py-4 rounded-2xl bg-navy-950/70 border border-white/15 focus:border-emerald-400 focus:outline-none text-2xl font-extrabold text-white placeholder-white/25"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setSendAmount(String(currentBalance))}
                                                className="absolute right-3 top-1/2 -translate-y-1/2 px-2.5 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 text-[11px] font-bold tracking-wider cursor-pointer"
                                            >
                                                {t.maxBtn}
                                            </button>
                                        </div>
                                    </div>

                                    {/* THIRD ELEMENT: PAY / ОПЛАТИТЬ Button */}
                                    <button
                                        type="submit"
                                        className="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-navy-950 font-extrabold text-base tracking-wider shadow-lg shadow-emerald-500/25 transition-all cursor-pointer"
                                    >
                                        {t.payBtn}
                                    </button>
                                </form>

                                {/* Transfer Confirmation Modal */}
                                {sendConfirmOpen && selectedRecipient && (
                                    <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
                                        <div
                                            onClick={() => !sendProcessing && setSendConfirmOpen(false)}
                                            className="fixed inset-0 bg-black/75 backdrop-blur-xs backdrop-fade-in"
                                        />
                                        <div className="relative z-10 w-full max-w-sm rounded-3xl app-gradient-bg border border-white/15 p-6 space-y-5 shadow-2xl">
                                            <div className="text-center">
                                                <h3 className="text-lg font-extrabold text-white">{t.confirmTransferTitle}</h3>
                                                <p className="text-xs text-white/60 mt-1">{t.confirmTransferSub}</p>
                                            </div>

                                            <div className="bg-navy-950/65 rounded-2xl p-4 space-y-3 border border-white/10 text-sm">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-white/60">{t.recipientRow}</span>
                                                    <span className="font-bold text-white truncate max-w-[170px]">
                                                        {selectedRecipient.fullName}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <span className="text-white/60">{t.commissionRow}</span>
                                                    <span className="text-emerald-400 font-medium">{t.freeFee}</span>
                                                </div>
                                                <div className="border-t border-white/10 pt-3 flex justify-between items-baseline">
                                                    <span className="text-white/75 font-semibold">{t.transferAmountRow}</span>
                                                    <span className="text-xl font-extrabold text-emerald-400">
                                                        {formatCoins(sendAmount)} ORINJI
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3">
                                                <button
                                                    type="button"
                                                    disabled={sendProcessing}
                                                    onClick={() => setSendConfirmOpen(false)}
                                                    className="py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 font-bold text-sm text-white cursor-pointer"
                                                >
                                                    {t.backBtn}
                                                </button>
                                                <button
                                                    type="button"
                                                    disabled={sendProcessing}
                                                    onClick={handleExecuteTransfer}
                                                    className="py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-navy-950 font-extrabold text-xs tracking-wider shadow-lg shadow-emerald-500/25 cursor-pointer"
                                                >
                                                    {sendProcessing ? '...' : t.confirmPayBtn}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>
                        )}

                        {/* =============================================================== */}
                        {/* VIEW 4: FULL TRANSACTION HISTORY ("История операций")           */}
                        {/* =============================================================== */}
                        {activeView === 'history' && (
                            <main className="space-y-5">
                                <div className="flex items-center gap-3">
                                    <button
                                        onClick={() => setActiveView('dashboard')}
                                        className="w-10 h-10 rounded-2xl glass-panel hover:bg-white/10 flex items-center justify-center cursor-pointer"
                                    >
                                        <Icon name="arrow-left" size={19} />
                                    </button>
                                    <h1 className="text-xl font-extrabold text-white">{t.menuHistory}</h1>
                                </div>

                                {/* Filter Tabs */}
                                <div className="grid grid-cols-3 gap-1.5 glass-panel p-1.5 rounded-2xl">
                                    {[
                                        { id: 'all', label: t.filterAll },
                                        { id: 'sent', label: t.filterSent },
                                        { id: 'received', label: t.filterReceived },
                                    ].map((tab) => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setHistoryFilter(tab.id)}
                                            className={`py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${historyFilter === tab.id
                                                    ? 'bg-emerald-500 text-navy-950'
                                                    : 'text-white/70 hover:text-white'
                                                }`}
                                        >
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>

                                {filteredTransactions.length === 0 ? (
                                    <div className="glass-panel rounded-3xl p-8 text-center">
                                        <div className="text-sm font-semibold text-white">{t.noTransactions}</div>
                                        <p className="text-xs text-white/55 mt-1">{t.noTransactionsSub}</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2.5">
                                        {filteredTransactions.map((tx) => {
                                            const isIncoming = tx.recipientId === authUser.uid;
                                            const isTopUp = tx.type === 'topup' || tx.senderId === 'TOPUP' || tx.senderId === 'SYSTEM';
                                            const title = isTopUp
                                                ? (tx.isWelcome ? t.welcomeBonusType : t.walletTopUpType)
                                                : isIncoming
                                                    ? `${t.receivedFrom} ${tx.senderName}`
                                                    : `${t.sentTo} ${tx.recipientName}`;

                                            return (
                                                <div
                                                    key={tx.id}
                                                    className="glass-panel rounded-2xl p-4 flex items-center justify-between gap-3"
                                                >
                                                    <div className="flex items-center gap-3.5 min-w-0">
                                                        <div
                                                            className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${isIncoming
                                                                    ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-400/25'
                                                                    : 'bg-amber-500/15 text-amber-300 border border-amber-400/25'
                                                                }`}
                                                        >
                                                            <Icon
                                                                name={isTopUp ? 'plus-circle' : isIncoming ? 'arrow-down-left' : 'arrow-up-right'}
                                                                size={20}
                                                            />
                                                        </div>
                                                        <div className="min-w-0">
                                                            <div className="text-sm font-semibold text-white truncate">{title}</div>
                                                            <div className="text-[11px] text-white/50 mt-0.5">
                                                                {formatDateTime(tx.timestamp, lang)}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="text-right shrink-0">
                                                        <div
                                                            className={`text-sm font-extrabold ${isIncoming ? 'text-emerald-400' : 'text-white'
                                                                }`}
                                                        >
                                                            {isIncoming ? '+' : '-'}{formatCoins(tx.amount)}
                                                        </div>
                                                        <div className="text-[10px] font-bold text-white/45">ORINJI</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </main>
                        )}

                        {/* =============================================================== */}
                        {/* VIEW 5: PROFILE ("Профиль")                                     */}
                        {/* =============================================================== */}
                        {activeView === 'profile' && (
                            <main className="space-y-6">
                                <div className="flex items-center gap-3">
                                    <button
                                        onClick={() => setActiveView('dashboard')}
                                        className="w-10 h-10 rounded-2xl glass-panel hover:bg-white/10 flex items-center justify-center cursor-pointer"
                                    >
                                        <Icon name="arrow-left" size={19} />
                                    </button>
                                    <h1 className="text-xl font-extrabold text-white">{t.profileTitle}</h1>
                                </div>

                                <div className="glass-panel rounded-3xl p-6 text-center">
                                    <div className="w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-teal-700 text-navy-950 font-extrabold text-3xl flex items-center justify-center mx-auto shadow-lg">
                                        {displayName.charAt(0).toUpperCase()}
                                    </div>
                                    <h2 className="text-xl font-extrabold text-white mt-4">{displayName}</h2>
                                    <div className="inline-flex items-center gap-1.5 mt-1.5 px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-400/30 text-xs font-semibold text-emerald-300">
                                        <Icon name="shield-check" size={14} />
                                        <span>{t.verifiedHolder}</span>
                                    </div>
                                </div>

                                <div className="glass-panel rounded-3xl p-5 space-y-4 text-sm">
                                    <div className="flex items-center justify-between pb-3 border-b border-white/10">
                                        <span className="text-white/60">{t.accountNumber}</span>
                                        <button
                                            onClick={() => copyToClipboard(walletNumber)}
                                            className="font-mono font-bold text-emerald-300 inline-flex items-center gap-1.5 cursor-pointer"
                                        >
                                            <span>{walletNumber}</span>
                                            <Icon name="copy" size={14} />
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between pb-3 border-b border-white/10">
                                        <span className="text-white/60">{t.emailAddress}</span>
                                        <span className="font-semibold text-white">{userProfile?.email || authUser.email}</span>
                                    </div>

                                    <div className="flex items-center justify-between">
                                        <span className="text-white/60">{t.memberSince}</span>
                                        <span className="font-semibold text-emerald-400">{t.verifiedActive}</span>
                                    </div>
                                </div>
                            </main>
                        )}

                        {/* =============================================================== */}
                        {/* VIEW 6: SETTINGS ("Настройки")                                  */}
                        {/* =============================================================== */}
                        {activeView === 'settings' && (
                            <main className="space-y-6">
                                <div className="flex items-center gap-3">
                                    <button
                                        onClick={() => setActiveView('dashboard')}
                                        className="w-10 h-10 rounded-2xl glass-panel hover:bg-white/10 flex items-center justify-center cursor-pointer"
                                    >
                                        <Icon name="arrow-left" size={19} />
                                    </button>
                                    <h1 className="text-xl font-extrabold text-white">{t.settingsTitle}</h1>
                                </div>

                                <div className="glass-panel rounded-3xl p-5 space-y-5">
                                    {/* Language Switcher Row */}
                                    <div className="flex items-center justify-between gap-4 pb-5 border-b border-white/10">
                                        <div>
                                            <div className="text-sm font-bold text-white">{t.languageSetting}</div>
                                            <div className="text-xs text-white/55 mt-0.5">{t.languageSettingSub}</div>
                                        </div>
                                        <div className="bg-navy-950/70 rounded-full p-1 flex items-center border border-white/10 shrink-0">
                                            <button
                                                onClick={() => handleLanguageChange('en')}
                                                className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer ${lang === 'en' ? 'bg-emerald-500 text-navy-950' : 'text-white/75'
                                                    }`}
                                            >
                                                EN
                                            </button>
                                            <button
                                                onClick={() => handleLanguageChange('ru')}
                                                className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer ${lang === 'ru' ? 'bg-emerald-500 text-navy-950' : 'text-white/75'
                                                    }`}
                                            >
                                                RU
                                            </button>
                                        </div>
                                    </div>

                                    {/* Security Row */}
                                    <div className="flex items-center justify-between gap-4">
                                        <div>
                                            <div className="text-sm font-bold text-white">{t.securitySetting}</div>
                                            <div className="text-xs text-white/55 mt-0.5">{t.securitySettingSub}</div>
                                        </div>
                                        <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold shrink-0">
                                            {t.enabledBadge}
                                        </span>
                                    </div>
                                </div>

                                <button
                                    onClick={handleLogout}
                                    className="w-full py-4 rounded-2xl bg-red-500/15 hover:bg-red-500/25 border border-red-400/25 text-red-200 font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer"
                                >
                                    <Icon name="log-out" size={18} />
                                    <span>{t.menuLogout}</span>
                                </button>

                                <div className="text-center text-[11px] text-white/40 pt-4">
                                    {t.appVersion}
                                </div>
                            </main>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
